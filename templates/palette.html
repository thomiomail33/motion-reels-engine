<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SM;font-weight:700;src:url(fonts/space-mono-latin-700-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1080"></canvas>
<script src="page.js"></script><script src="engine.js"></script><script>
// Accent colour chooser. Copy into engine/ and run: node snap.js palette.html palette.png 1080 1080
// The background and stick figure stay the same for every page (that IS the format). Only the accent changes.
const SWATCHES = [['EMBER','#FF7A1A'],['OCEAN','#3DA5FF'],['MINT','#2BD9A0'],['GOLD','#F2C94C'],['ROSE','#FF5C8A'],['VIOLET','#9B7BFF']];
window.draw = () => {
g.fillStyle = '#050505'; g.fillRect(0, 0, 1080, 1080);
SWATCHES.forEach(([name, hex], i) => {
  const col = i % 3, row = Math.floor(i / 3), x = 30 + col * 345, y = 30 + row * 525, w = 330, h = 505;
  const bg = g.createRadialGradient(x + w / 2, y + h / 2, 20, x + w / 2, y + h / 2, 330); bg.addColorStop(0, '#22242a'); bg.addColorStop(1, '#060606');
  g.fillStyle = bg; rr(x, y, w, h, 18); g.fill();
  g.fillStyle = hex; rr(x + 70, y + 40, w - 140, 54, 27); g.fill();
  label('DAY 90', x + w / 2, y + 67, 28, '#111', 700);
  const gy = y + 420; g.fillStyle = hex; g.fillRect(x + 175, gy - 90, 110, 90); g.fillStyle = '#9a9a9a'; g.fillRect(x + 65, gy - 45, 110, 45);
  const p = POSE.walk(1.1); figure(x + 230, gy - 90 - legDrop(p, .5), p, { scale: .5 });
  label(name, x + w / 2, y + 455, 30, '#fff', 700); label(hex, x + w / 2, y + 488, 22, '#8a93a0', 700);
});
};
</script></body></html>
